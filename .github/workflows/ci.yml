name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    name: Lint, Analyze & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_PEPPER: ci-fixed-pepper-not-a-secret-only-for-pipeline-runs-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, pgsql, redis, bcmath, intl, mbstring, gd, zip, fileinfo, openssl, tokenizer, xml, ctype, json
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Create Postgres roles (acho_app, acho_migrator)
        env:
          POSTGRES_USER: sail
          POSTGRES_DB: testing
          POSTGRES_PASSWORD: password
          PGPASSWORD: password
          PGHOST: 127.0.0.1
          PGPORT: 5432
        run: bash docker/postgres/20-create-roles.sh

      - name: Run migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_USERNAME: acho_migrator
          DB_PASSWORD: password
        run: php artisan migrate --force

      - name: PHP — Pint (code style)
        run: ./vendor/bin/pint --test

      - name: PHP — Larastan (static analysis)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: TS — Type check
        run: npm run type-check

      - name: TS — ESLint
        run: npx eslint .

      - name: TS — Prettier
        run: npx prettier --check .

      - name: PHP — Pest (tests)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: testing
          DB_PASSWORD: password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test
